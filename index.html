</style></head><body><main class="shell"><div class="top"><div class="brand">LEVEL <b>UP</b></div><div class="pill">להתקדם בקצב שלך</div></div><div id="app"></div></main><nav class="nav" id="nav" aria-label="ניווט ראשי"></nav><div id="modal"></div><script>
(()=>{'use strict';const OLD='levelup_v1',KEY='levelup_v4',today=()=>localDate(new Date()),localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,id=()=>String(Date.now())+Math.random().toString(36).slice(2,7),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const base=()=>({name:'',tasks:[],habits:[],goals:[],history:[],awarded:{},xp:0,restDays:{},workouts:[],sessions:[],customPlans:[],focusMinutes:0});let state;try{const saved=localStorage.getItem(KEY),legacy=localStorage.getItem(OLD);state={...base(),...JSON.parse(saved||legacy||'{}')};}catch{state=base()}for(const k of ['tasks','habits','goals','workouts','sessions','customPlans'])if(!Array.isArray(state[k]))state[k]=[];state.restDays=state.restDays||{};let page='today',activePlan='all';function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('לא ניתן לשמור כרגע. כדאי לפנות מקום באחסון.')}}function toast(s){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}const templates=[{id:'full',name:'אימון כוח כללי',desc:'אימון גוף מלא עם אפשרות להתאמה',exercises:[['סקוואט',3,10],['שכיבות סמיכה',3,8],['חתירה עם גומייה',3,10],['גשר ישבן',3,12]]},{id:'upper',name:'פלג גוף עליון',desc:'תרגילי דחיפה ומשיכה',exercises:[['שכיבות סמיכה',3,8],['חתירה עם גומייה',3,10],['לחיצת כתפיים',2,10]]},{id:'mobility',name:'תנועה ויציבה',desc:'אימון קל של שליטה ותנועה',exercises:[['סקוואט ללא משקל',2,10],['גשר ישבן',2,12],['בירד דוג',2,8]]}];function taskDone(t){return !!t.done}function habitLogs(h){return Array.isArray(h.logs)?h.logs:[]}function progress(a,b){return `<div class="bar"><span style="width:${b?Math.min(100,Math.round(100*a/b)):0}%"></span></div>`}function taskItem(t){return `<div class="item"><button class="check ${t.done?'done':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="סמן משימה">${t.done?'✓':''}</button><div class="grow"><strong>${esc(t.title)}</strong><small>${esc(t.date||'ללא תאריך')}</small></div><button class="btn ghost small" data-act="task-edit" data-id="${esc(t.id)}">עריכה</button></div>`}function habitItem(h){let done=habitLogs(h).includes(today()),rest=(state.restDays[h.id]||[]).includes(today());return `<div class="item"><div class="grow"><strong>${esc(h.title)}</strong><small>${habitLogs(h).length} ביצועים בסך הכול ${rest?'· יום מנוחה':''}</small></div><button class="btn ${done?'secondary':''} small" data-act="habit-toggle" data-id="${esc(h.id)}">${done?'בוצע ✓':'סמן ביצוע'}</button><button class="btn ghost small" data-act="rest" data-id="${esc(h.id)}">מנוחה</button></div>`}function weekDays(h){let s='';for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=localDate(d),yes=habitLogs(h).includes(key),rest=(state.restDays[h.id]||[]).includes(key);s+=`<div class="day ${yes?'yes':rest?'rest':''}">${['א','ב','ג','ד','ה','ו','ש'][d.getDay()]}<div>${yes?'✓':rest?'–':'·'}</div></div>`}return `<div class="week">${s}</div>`}function goalCard(g){let steps=Array.isArray(g.steps)?g.steps:[],n=steps.filter(s=>s.done).length;return `<div class="card"><div class="row"><strong>${esc(g.title)}</strong><span class="tiny">${n}/${steps.length} צעדים</span></div>${progress(n,steps.length)}${steps.map((s,i)=>`<div class="item"><button class="check ${s.done?'done':''}" data-act="step" data-id="${esc(g.id)}" data-index="${i}">${s.done?'✓':''}</button><div class="grow">${esc(s.title)}</div></div>`).join('')}<button class="btn secondary small" data-act="add-step" data-id="${esc(g.id)}">הוסף צעד</button></div>`}function sessionCard(s){return `<div class="item"><div class="grow"><strong>${esc(s.name)}</strong><small>${esc(s.date)} · ${s.exercises.length} תרגילים</small></div><span class="tag">הושלם</span></div>`}function render(){let h='';if(page==='today'){let daily=state.tasks.filter(t=>!t.date||t.date===today()),done=daily.filter(taskDone).length,habDone=state.habits.filter(x=>habitLogs(x).includes(today())).length;h=`<div class="hero card"><div class="tiny" style="color:#d5c9f3">${new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${state.name?'שלום, '+esc(state.name):'היום שלך מתחיל כאן'}</h1><p style="color:#d0ccdd;margin:0">שינוי משמעותי נבנה מצעדים קטנים ועקביים.</p></div><div class="grid"><div class="card"><div class="muted">משימות היום</div><div class="stat">${done}<span class="tiny"> / ${daily.length}</span></div>${progress(done,daily.length)}</div><div class="card"><div class="muted">הרגלים שבוצעו</div><div class="stat">${habDone}<span class="tiny"> / ${state.habits.length}</span></div>${progress(habDone,state.habits.length)}</div></div><div class="section"><h2>מה עושים היום?</h2><button class="btn secondary small" data-act="task-add">+ משימה</button></div><div class="card">${daily.length?daily.slice(0,6).map(taskItem).join(''):'<div class="empty">עוד אין משימות להיום</div>'}</div><div class="section"><h2>הרגלים יומיים</h2><button class="btn secondary small" data-page="habits">לכל ההרגלים</button></div><div class="card">${state.habits.length?state.habits.slice(0,4).map(habitItem).join(''):'<div class="empty">כדאי להתחיל בהרגל קטן אחד</div>'}</div><div class="section"><h2>האימון הבא</h2></div><div class="card"><strong>מתקדמים צעד אחד בכל פעם</strong><p class="muted">בחר תוכנית מוכנה או צור אימון שמתאים לך.</p><button class="btn full" data-page="workouts">מעבר לאימונים</button></div>`}if(page==='workouts'){h=`<h1>אימונים</h1><p class="muted">תוכניות מוכנות, אימונים אישיים ומעקב אחר ביצועים.</p><div class="chips">${[['all','הכול'],['ready','מוכנים'],['mine','שלי']].map(([k,v])=>`<button data-act="filter" data-value="${k}" class="${activePlan===k?'active':''}">${v}</button>`).join('')}</div><button class="btn full" data-act="plan-add">+ בניית אימון אישי</button>`;let plans=[...(activePlan!=='mine'?templates.map(x=>({...x,ready:true})):[]),...(activePlan!=='ready'?state.customPlans.map(x=>({...x,ready:false})):[])];h+=plans.map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.name)}</strong><div class="tiny">${esc(p.desc||'אימון אישי')} · ${p.exercises.length} תרגילים</div></div><span class="tag">${p.ready?'תוכנית מוכנה':'שלי'}</span></div><button class="btn full" data-act="start" data-id="${esc(p.id)}" data-ready="${p.ready?'1':'0'}">פתיחת אימון</button></div>`).join('')||'<div class="empty">עדיין לא יצרת אימונים אישיים</div>';h+=`<div class="section"><h2>היסטוריית אימונים</h2></div><div class="card">${state.sessions.length?state.sessions.slice().reverse().slice(0,12).map(sessionCard).join(''):'<div class="empty">האימון הראשון שלך יופיע כאן</div>'}</div>`}if(page==='habits'){h=`<h1>הרגלים</h1><p class="muted">עקביות לאורך זמן, עם מקום למנוחה ולשינויים בשגרה.</p><button class="btn full" data-act="habit-add">+ הרגל חדש</button>`+state.habits.map(x=>`<div class="card">${habitItem(x)}${weekDays(x)}<button class="btn ghost small" style="margin-top:13px" data-act="habit-delete" data-id="${esc(x.id)}">מחיקת הרגל</button></div>`).join('');if(!state.habits.length)h+='<div class="card empty">עדיין אין הרגלים. בחר פעולה קטנה שתרצה להתמיד בה.</div>'}if(page==='goals'){h=`<h1>מטרות ומשימות</h1><p class="muted">מטרות גדולות מתקדמות דרך צעדים קטנים.</p><div class="grid"><button class="btn" data-act="goal-add">+ מטרה</button><button class="btn secondary" data-act="task-add">+ משימה</button></div><div class="section"><h2>המטרות שלי</h2></div>${state.goals.map(goalCard).join('')||'<div class="card empty">אין עדיין מטרות</div>'}<div class="section"><h2>כל המשימות</h2></div><div class="card">${state.tasks.map(taskItem).join('')||'<div class="empty">אין עדיין משימות</div>'}</div>`}if(page==='progress'){let now=new Date(),week=new Date(now);week.setDate(now.getDate()-6);let start=localDate(week),n=state.sessions.filter(s=>s.date>=start).length,hab=state.habits.reduce((a,x)=>a+habitLogs(x).filter(d=>d>=start).length,0),task=state.tasks.filter(x=>x.done).length;h=`<h1>ההתקדמות שלי</h1><p class="muted">מדדים אמיתיים, בלי ניקוד ומשחקים.</p><div class="grid"><div class="card"><div class="muted">אימונים השבוע</div><div class="stat">${n}</div></div><div class="card"><div class="muted">ביצועי הרגלים השבוע</div><div class="stat">${hab}</div></div><div class="card"><div class="muted">משימות שהושלמו</div><div class="stat">${task}</div></div><div class="card"><div class="muted">אימונים בסך הכול</div><div class="stat">${state.sessions.length}</div></div></div><div class="section"><h2>שיפור בביצועים</h2></div><div class="card">${state.sessions.length?state.sessions.slice(-8).reverse().map(s=>`<div class="item"><div class="grow"><strong>${esc(s.name)}</strong><small>${esc(s.date)}</small>${s.exercises.map(e=>`<small>${esc(e.name)}: ${esc(e.sets)} סטים × ${esc(e.reps)} חזרות${e.weight?' · '+esc(e.weight)+' ק״ג':''}</small>`).join('')}</div></div>`).join(''):'<div class="empty">אחרי שתתעד אימונים, תוכל להשוות את הביצועים שלך לאורך זמן.</div>'}</div><div class="section"><h2>הגדרות וגיבוי</h2></div><div class="card"><label class="label">השם שלי</label><input class="field" id="profileName" maxlength="35" value="${esc(state.name)}"><button class="btn secondary small" data-act="name">שמירת שם</button><div style="margin-top:20px"><button class="btn secondary small" data-act="export">הורדת גיבוי</button> <button class="btn ghost small" data-act="import">שחזור גיבוי</button><input type="file" id="importFile" accept="application/json" hidden></div><p class="tiny">הנתונים נשמרים במכשיר ובדפדפן הזה. לפני החלפת מכשיר או ניקוי נתוני גלישה, הורד גיבוי.</p></div>`}$('#app').innerHTML=h;$('#nav').innerHTML=[['today','⌂','היום'],['workouts','◉','אימונים'],['habits','✓','הרגלים'],['goals','◎','מטרות'],['progress','▥','התקדמות']].map(([k,ico,label])=>`<button data-page="${k}" class="${page===k?'active':''}"><span>${ico}</span>${label}</button>`).join('')}
function modal(title,fields,cb){$('#modal').innerHTML=`<div class="overlay"><form class="dialog"><div class="row"><h2>${esc(title)}</h2><button type="button" class="btn ghost small" id="close">סגור ×</button></div>${fields}<button class="btn full" type="submit">שמירה</button></form></div>`;$('#close').onclick=()=>$('#modal').innerHTML='';$('.dialog form')?.remove;$('.dialog').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;cb(f);$('#modal').innerHTML='';save();render()}}function taskForm(key){let t=state.tasks.find(x=>String(x.id)===String(key));modal(t?'עריכת משימה':'משימה חדשה',`<label class="label">שם המשימה</label><input class="field" name="title" required maxlength="100" value="${esc(t?.title||'')}"><label class="label">תאריך</label><input class="field" name="date" type="date" value="${esc(t?.date||today())}">`,f=>{if(t){t.title=f.elements.title.value.trim();t.date=f.elements.date.value}else state.tasks.push({id:id(),title:f.elements.title.value.trim(),date:f.elements.date.value,priority:'רגילה',done:false})})}function habitForm(){modal('הרגל חדש',`<label class="label">שם ההרגל</label><input class="field" name="title" required maxlength="80" placeholder="למשל: לצאת להליכה"><label class="label">כמה פעמים בשבוע?</label><select class="field" name="frequency">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===3?'selected':''}>${n}</option>`).join('')}</select>`,f=>state.habits.push({id:id(),title:f.elements.title.value.trim(),frequency:Number(f.elements.frequency.value),icon:'◉',logs:[]}))}function goalForm(){modal('מטרה חדשה',`<label class="label">המטרה</label><input class="field" name="title" required maxlength="100"><label class="label">צעד ראשון</label><input class="field" name="step" required maxlength="100">`,f=>state.goals.push({id:id(),title:f.elements.title.value.trim(),steps:[{title:f.elements.step.value.trim(),done:false}]}))}function planForm(){modal('אימון אישי חדש',`<label class="label">שם האימון</label><input class="field" name="name" required maxlength="70" placeholder="למשל: אימון כוח שלי"><label class="label">תרגילים (כל שורה: שם, סטים, חזרות)</label><textarea class="field" name="exercises" rows="6" required placeholder="סקוואט, 3, 10&#10;שכיבות סמיכה, 3, 8"></textarea>`,f=>{let exercises=f.elements.exercises.value.split('\n').map(x=>x.split(',').map(z=>z.trim())).filter(x=>x[0]).slice(0,25).map(([name,sets,reps])=>[name,Math.min(30,Math.max(1,Number(sets)||3)),Math.min(100,Math.max(1,Number(reps)||10))]);state.customPlans.push({id:id(),name:f.elements.name.value.trim(),desc:'תוכנית אישית',exercises})})}function startPlan(p){if(!p)return;let exercises=p.exercises.map(e=>({name:Array.isArray(e)?e[0]:e.name,sets:Array.isArray(e)?e[1]:e.sets,reps:Array.isArray(e)?e[2]:e.reps,weight:''}));let fields=`<p class="muted">אפשר לערוך את הסטים, החזרות והמשקל לפני שמירת האימון. בחר עומס שמתאים לך ואל תתאמן דרך כאב.</p>`+exercises.map((e,i)=>`<div class="exercise"><strong>${esc(e.name)}</strong><div class="grid"><div><label class="label">סטים</label><input class="field" name="sets${i}" type="number" min="1" max="30" required value="${esc(e.sets)}"></div><div><label class="label">חזרות</label><input class="field" name="reps${i}" type="number" min="1" max="100" required value="${esc(e.reps)}"></div></div><label class="label">משקל בק״ג (לא חובה)</label><input class="field" name="weight${i}" type="number" min="0" max="1000" step="0.5" placeholder="ללא משקל"></div>`).join('');modal('תיעוד: '+p.name,fields,f=>{let ex=exercises.map((e,i)=>({...e,sets:Number(f.elements['sets'+i].value),reps:Number(f.elements['reps'+i].value),weight:f.elements['weight'+i].value}));state.sessions.push({id:id(),date:today(),name:p.name,exercises:ex});toast('האימון נשמר בהצלחה')})}function exportData(){let blob=new Blob([JSON.stringify({app:'LEVEL UP',version:4,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='level-up-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-act]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0);return}let a=b.dataset.act,key=b.dataset.id,t=state.tasks.find(x=>String(x.id)===key),h=state.habits.find(x=>String(x.id)===key),g=state.goals.find(x=>String(x.id)===key);if(a==='task-add'||a==='task-edit')return taskForm(key);if(a==='habit-add')return habitForm();if(a==='goal-add')return goalForm();if(a==='plan-add')return planForm();if(a==='add-step')return modal('צעד חדש','<label class="label">מה הצעד הבא?</label><input class="field" name="title" required maxlength="100">',f=>g?.steps.push({title:f.elements.title.value.trim(),done:false}));if(a==='start'){let p=b.dataset.ready==='1'?templates.find(x=>x.id===key):state.customPlans.find(x=>String(x.id)===key);return startPlan(p)}if(a==='filter'){activePlan=b.dataset.value;return render()}if(a==='task-toggle'&&t){t.done=!t.done;if(t.done)t.completedAt=today()}if(a==='habit-toggle'&&h){h.logs=habitLogs(h);h.logs=h.logs.includes(today())?h.logs.filter(x=>x!==today()):[...h.logs,today()]}if(a==='rest'&&h){let arr=state.restDays[h.id]||[];state.restDays[h.id]=arr.includes(today())?arr.filter(x=>x!==today()):[...arr,today()]}if(a==='habit-delete'&&h){if(!confirm('למחוק את ההרגל?'))return;state.habits=state.habits.filter(x=>x!==h)}if(a==='step'&&g?.steps[Number(b.dataset.index)])g.steps[Number(b.dataset.index)].done=!g.steps[Number(b.dataset.index)].done;if(a==='name')state.name=$('#profileName').value.trim();if(a==='export')return exportData();if(a==='import'){let input=$('#importFile');input.onchange=async()=>{try{let obj=JSON.parse(await input.files[0].text()),data=obj.data||obj;if(!Array.isArray(data.tasks)||!Array.isArray(data.habits)||!Array.isArray(data.goals))throw Error('bad');if(confirm('לשחזר את הגיבוי? הפעולה תחליף את הנתונים הנוכחיים בגרסה 4.0.')){state={...base(),...data};save();render();toast('הגיבוי שוחזר')}}catch{toast('קובץ הגיבוי לא תקין')}};input.click();return}save();render()});save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
