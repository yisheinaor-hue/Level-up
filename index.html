<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101426"><meta name="description" content="LEVEL UP — מטרות, הרגלים וניהול זמן"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png"><title>LEVEL UP 3.0</title><style>
:root{font-family:system-ui,Arial;background:#0c1020;color:#f5f5ff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}.app{max-width:520px;margin:auto;min-height:100dvh;padding:22px 17px 100px;background:radial-gradient(ellipse at top right,#25204d 0,transparent 46%),#0c1020}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:24px;letter-spacing:1px}.brand b{color:#b7a2ff}.muted{color:#9ba4c1;font-size:13px}.chip{background:#252744;border:1px solid #45416d;border-radius:100px;padding:8px 12px;font-size:12px}.card{background:#1b2035;border:1px solid #343c59;border-radius:19px;padding:17px;margin:13px 0;box-shadow:0 8px 25px #0002}.hero{background:linear-gradient(120deg,#6751d7,#a077e5);border:0}.hero h1{font-size:27px;margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{background:#343c59;height:9px;border-radius:12px;overflow:hidden;margin-top:12px}.progress div{height:100%;background:linear-gradient(90deg,#6fe3b8,#b8a3ff);transition:width .2s}.hero .progress{background:#ffffff44}.hero .progress div{background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{margin:0}.mini strong{display:block;font-size:23px;margin-top:7px}.avatarbig{font-size:100px;line-height:1.5}.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shopitem{margin:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.shopitem button{margin-top:auto}.itememoji{font-size:58px}.achievement{text-align:center;display:flex;align-items:center;flex-direction:column;gap:8px}.achievement.unlocked{border-color:#a18af6;background:#282348}.nav{overflow-x:auto;grid-template-columns:repeat(8,minmax(65px,1fr));scrollbar-width:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#161a2e;border-top:1px solid #343c59;padding:10px 3px max(12px,env(safe-area-inset-bottom));z-index:3}.nav button{background:none;border:0;color:#919bb8;font-size:11px;padding:4px 0}.nav button.active{color:#bdaaff;font-weight:900}.nav button span{display:block;font-size:21px;margin-bottom:4px}.btn{border:0;border-radius:12px;background:#9478f5;color:white;padding:12px 16px;font-weight:800}.secondary{background:#2b3150;color:#dddaf7}.danger{background:#50263c;color:#ffbbcd}.full{width:100%}.entry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #353a54}.entry:last-child{border:0}.entry .grow{flex:1;min-width:0}.entry .grow strong{display:block;overflow-wrap:anywhere}.entry button.icon{background:#2b3150;border:0;border-radius:10px;padding:8px;color:#d6d2f4}.check{width:27px;height:27px;flex:none;border-radius:9px;border:2px solid #9c8af4;background:transparent;color:white}.check.done{background:#8d74e9}.sectiontitle{font-size:21px;margin:25px 0 8px}.field{width:100%;background:#10162b;color:white;border:1px solid #49516f;border-radius:12px;padding:12px;margin:6px 0 14px;outline-color:#a48cff}label{font-size:13px;color:#c5c7df}.empty{padding:22px;text-align:center;color:#aab2ce}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;background:#252b45;color:#b9bed3;border:0;border-radius:12px;padding:10px}.tabs button.on{background:#8269df;color:white}.timer{font-size:64px;font-weight:900;text-align:center;letter-spacing:2px;margin:20px 0;font-variant-numeric:tabular-nums}.tag{font-size:11px;color:#c5b9ff;background:#332b57;padding:5px 9px;border-radius:50px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#332a59;color:white;padding:12px 20px;border-radius:12px;z-index:6;box-shadow:0 8px 30px #0008}.hidden{display:none}.overlay{position:fixed;inset:0;background:#000b;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:100%;max-width:430px;background:#20253d;border:1px solid #4d5273;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.smallbtn{padding:8px 10px;font-size:12px}.weekday{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:8px 0;text-align:center;background:#2a304c;border-radius:9px;font-size:11px}.day.hit{background:#6f5cc7}.badge{font-size:11px;background:#34335d;padding:6px 9px;border-radius:20px}
</style></head><body><main id="app" class="app"></main><nav id="nav" class="nav"></nav><div id="modalroot"></div><script>
(()=>{'use strict';const KEY='levelup_v1',today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now()+Math.floor(Math.random()*99999);const defaults=()=>({name:'אלוף',xp:0,tasks:[],habits:[],goals:[],history:[],awarded:{},coins:0,owned:[],equipped:'classic',claimed:[],restDays:{}});let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=defaults()}state.coins=Number(state.coins)||0;state.owned=Array.isArray(state.owned)?state.owned:[];state.claimed=Array.isArray(state.claimed)?state.claimed:[];state.restDays=state.restDays||{};let page='home',taskFilter='all',timerSeconds=25*60,timerRunning=false,timerEnd=0,timerHandle=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(msg){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),2100)}function earn(points,key){if(state.awarded[key])return;state.awarded[key]=true;state.xp+=points;state.coins=(state.coins||0)+Math.max(1,Math.round(points/2));toast('✨ +'+points+' XP!')}const level=()=>Math.floor(state.xp/200)+1,levelPct=()=>state.xp%200/2;const taskDone=()=>state.tasks.filter(t=>t.done).length,habitsDone=()=>state.habits.filter(h=>h.logs.includes(today())).length;function progress(p){return `<div class="progress"><div style="width:${Math.min(100,Math.max(0,p))}%"></div></div>`}function header(title,desc){return `<h1 class="sectiontitle">${title}</h1><div class="muted">${desc}</div>`}function taskRow(t){return `<div class="entry"><button class="check ${t.done?'done':''}" data-action="task-toggle" data-id="${t.id}" aria-label="סימון משימה">${t.done?'✓':''}</button><div class="grow"><strong style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</strong><span class="muted">${esc(t.date||'ללא תאריך')} · ${esc(t.priority)}</span></div><button class="icon" data-action="task-edit" data-id="${t.id}" aria-label="עריכה">✎</button><button class="icon" data-action="task-delete" data-id="${t.id}" aria-label="מחיקה">×</button></div>`}function habitRow(h){let done=h.logs.includes(today());return `<div class="entry"><div style="font-size:27px">${esc(h.icon)}</div><div class="grow"><strong>${esc(h.title)}</strong><span class="muted">🔥 רצף ${streak(h)} ימים · ${h.logs.length} ביצועים</span></div><button class="btn smallbtn ${done?'secondary':''}" data-action="habit-toggle" data-id="${h.id}">${done?'✓ בוצע':'סמן בוצע'}</button><button class="icon" data-action="habit-rest" data-id="${h.id}" title="יום מנוחה">☕</button><button class="icon" data-action="habit-delete" data-id="${h.id}">×</button></div>`}function goalRow(g){let n=g.steps.filter(x=>x.done).length,p=g.steps.length?100*n/g.steps.length:0;return `<div class="card"><div class="row"><strong>${esc(g.title)}</strong><span class="tag">${n}/${g.steps.length} צעדים</span></div>${progress(p)}<div style="margin-top:12px">${g.steps.map((s,i)=>`<div class="entry"><button class="check ${s.done?'done':''}" data-action="step-toggle" data-id="${g.id}" data-step="${i}">${s.done?'✓':''}</button><div class="grow">${esc(s.title)}</div></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn secondary smallbtn" data-action="step-add" data-id="${g.id}">+ הוסף צעד</button><button class="btn danger smallbtn" data-action="goal-delete" data-id="${g.id}">מחק מטרה</button></div></div>`}const ITEMS=[{id:'classic',name:'הדמות המקורית',emoji:'🧑‍🚀',cost:0},{id:'ninja',name:'נינג׳ה',emoji:'🥷',cost:80},{id:'wizard',name:'קוסם',emoji:'🧙',cost:140},{id:'robot',name:'רובוט',emoji:'🤖',cost:200},{id:'hero',name:'גיבור',emoji:'🦸',cost:300},{id:'dragon',name:'דרקון',emoji:'🐉',cost:450}];const BADGES=[{id:'first',name:'הצעד הראשון',desc:'השלמת משימה אחת',icon:'🌟',ok:()=>taskDone()>=1},{id:'five',name:'בדרך למעלה',desc:'השלמת 5 משימות',icon:'🎯',ok:()=>taskDone()>=5},{id:'ten',name:'עשר מתוך עשר',desc:'השלמת 10 משימות',icon:'🏅',ok:()=>taskDone()>=10},{id:'habit',name:'בונה הרגלים',desc:'ביצוע הרגל 5 פעמים',icon:'🌱',ok:()=>state.habits.some(h=>h.logs.length>=5)},{id:'level',name:'עולה רמה',desc:'הגעה לרמה 3',icon:'🚀',ok:()=>level()>=3},{id:'focus',name:'זמן לעצמי',desc:'סיום סשן ריכוז',icon:'⏳',ok:()=>Object.keys(state.awarded).some(k=>k.startsWith('focus:'))}];const isoWeek=()=>{let d=new Date(),x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return x.getUTCFullYear()+'-'+Math.ceil((((x-y)/86400000)+1)/7)};const weekStart=()=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('en-CA')};const weekLogs=()=>state.habits.reduce((n,h)=>n+h.logs.filter(d=>d>=weekStart()).length,0);const CHALLENGES=[{id:'habits',name:'מתמידים השבוע',desc:'בצע הרגלים 5 פעמים',target:5,prize:40,progress:()=>weekLogs()},{id:'tasks',name:'משימות השבוע',desc:'השלם 5 משימות השבוע',target:5,prize:50,progress:()=>state.tasks.filter(t=>t.done&&(t.completedAt||t.date||'')>=weekStart()).length},{id:'focus',name:'שבוע של ריכוז',desc:'השלם 2 סבבי ריכוז השבוע',target:2,prize:30,progress:()=>Object.keys(state.awarded).filter(k=>k.startsWith('focus:')&&Number(k.split(':')[1])>=new Date(weekStart()).getTime()).length}];function streak(h){let days=new Set(h.logs);let d=new Date();d.setHours(12,0,0,0);if(!days.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);let n=0;for(let i=0;i<365;i++){let k=d.toLocaleDateString('en-CA');if(days.has(k)){n++;d.setDate(d.getDate()-1)}else if(state.restDays[h.id]?.includes(k)){d.setDate(d.getDate()-1)}else break}return n}function extraPage(){if(page==='avatar'){let it=ITEMS.find(x=>x.id===state.equipped)||ITEMS[0];return header('הדמות שלי','כל פעולה טובה מחזקת אותך')+`<div class="card hero" style="text-align:center"><div class="avatarbig">${it.emoji}</div><h2>${esc(state.name)} · רמה ${level()}</h2><div>⭐ ${state.xp} XP · 🪙 ${state.coins} מטבעות</div>${progress(levelPct())}<div class="muted" style="color:white;margin-top:8px">${200-state.xp%200} XP לרמה הבאה</div></div>`+header('חנות הדמויות','מרוויחים מטבעות מהתקדמות אמיתית')+`<div class="shopgrid">${ITEMS.map(x=>{let owned=x.cost===0||state.owned.includes(x.id),equipped=state.equipped===x.id;return `<div class="card shopitem"><div class="itememoji">${x.emoji}</div><strong>${x.name}</strong><div class="muted">${x.cost?x.cost+' 🪙':'בחינם'}</div><button class="btn smallbtn ${equipped?'secondary':''}" data-action="shop" data-value="${x.id}" ${equipped?'disabled':''}>${equipped?'בשימוש':owned?'בחר דמות':'קנה'}</button></div>`}).join('')}</div>`}if(page==='achievements')return header('הישגים','כל צעד נחשב')+`<div class="grid">${BADGES.map(b=>`<div class="card achievement ${b.ok()?'unlocked':''}"><div style="font-size:34px">${b.ok()?b.icon:'🔒'}</div><strong>${b.name}</strong><div class="muted">${b.desc}</div><div class="tag">${b.ok()?'נפתח!':'עדיין נעול'}</div></div>`).join('')}</div>`;if(page==='challenges')return header('אתגרי השבוע','מתחילים מחדש בכל יום שני')+`<div class="card"><strong>🪙 ${state.coins} מטבעות זמינים</strong><p class="muted">האתגרים מתאפסים בכל שבוע. הפרס ניתן פעם אחת לאתגר.</p></div>`+CHALLENGES.map(c=>{let n=Math.min(c.target,c.progress()),claimed=state.claimed.includes(isoWeek()+':'+c.id);return `<div class="card"><div class="row"><strong>${c.name}</strong><span class="tag">${n}/${c.target}</span></div><p class="muted">${c.desc} · פרס ${c.prize} 🪙</p>${progress(n/c.target*100)}<button class="btn smallbtn" style="margin-top:12px" data-action="claim" data-value="${c.id}" ${n<c.target||claimed?'disabled':''}>${claimed?'✓ נאסף':n<c.target?'עוד לא הושלם':'אסוף פרס'}</button></div>`}).join('');return ''}function render(){let html=`<div class="top"><div class="brand">⚡ LEVEL <b>UP</b></div><div class="chip">🏆 רמה ${level()} · ${state.xp} XP</div></div>`;if(['avatar','achievements','challenges'].includes(page)){html+=extraPage()}if(page==='home'){let total=state.tasks.filter(t=>!t.date||t.date===today()),done=total.filter(t=>t.done).length;html+=`<div class="card hero"><div>המסע שלך מתחיל בצעד אחד</div><h1>היי, ${esc(state.name)} 👋</h1><div>רמה ${level()} · ${200-state.xp%200} XP לרמה הבאה</div>${progress(levelPct())}</div><div class="grid"><div class="card mini"><span class="muted">משימות שהושלמו</span><strong>${done}/${total.length}</strong></div><div class="card mini"><span class="muted">הרגלים היום</span><strong>${habitsDone()}/${state.habits.length}</strong></div></div><div class="card"><div class="row"><strong>🪙 ${state.coins} מטבעות</strong><button class="btn smallbtn" data-page="avatar">לחנות הדמויות</button></div></div>${header('המשימות שלי להיום','כל התקדמות מתחילה בפעולה אחת')}<div class="card">${total.length?total.slice(0,5).map(taskRow).join(''):'<div class="empty">עדיין אין משימות. זה זמן טוב להתחיל!</div>'}<button class="btn full" data-action="task-add" style="margin-top:12px">+ הוסף משימה</button></div>${header('ההרגלים שלי','פעולות קטנות, שינוי גדול')}<div class="card">${state.habits.length?state.habits.slice(0,4).map(habitRow).join(''):'<div class="empty">הוסף הרגל ראשון כדי להתחיל.</div>'}<button class="btn secondary full" data-action="habit-add" style="margin-top:12px">+ הרגל חדש</button></div>`}if(page==='tasks'){html+=header('ניהול משימות','היום שלך, בקצב שלך')+`<div class="tabs">${[['all','הכול'],['open','לביצוע'],['done','הושלמו']].map(([k,v])=>`<button data-action="filter" data-value="${k}" class="${taskFilter===k?'on':''}">${v}</button>`).join('')}</div><button class="btn full" data-action="task-add">+ משימה חדשה</button><div class="card">${state.tasks.filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done)).sort((a,b)=>(a.done-b.done)).map(taskRow).join('')||'<div class="empty">אין משימות להצגה</div>'}</div>`}if(page==='habits'){html+=header('בניית הרגלים','התמדה גמישה, בלי לחץ מיותר')+`<div class="card"><div class="row"><strong>ההתקדמות היום</strong><span>${habitsDone()}/${state.habits.length}</span></div>${progress(state.habits.length?100*habitsDone()/state.habits.length:0)}</div><button class="btn full" data-action="habit-add">+ הרגל חדש</button><div class="card">${state.habits.map(habitRow).join('')||'<div class="empty">עוד לא יצרת הרגלים</div>'}</div>`}if(page==='goals'){html+=header('המטרות שלי','מפרקים חלומות לצעדים קטנים')+`<button class="btn full" data-action="goal-add">+ מטרה חדשה</button>${state.goals.map(goalRow).join('')||'<div class="card empty">אין מטרות עדיין. מה תרצה להשיג?</div>'}`}if(page==='focus'){html+=header('זמן להתמקד','בחר משימה אחת ותן לה מקום')+`<div class="card"><div class="muted" style="text-align:center">טיימר ריכוז</div><div class="timer" id="timerDisplay">${clock(timerSeconds)}</div><div class="row"><button class="btn" data-action="timer-toggle">${timerRunning?'⏸ עצור':'▶ התחל'}</button><button class="btn secondary" data-action="timer-reset">↻ איפוס</button></div><div class="tabs">${[15,25,45].map(n=>`<button data-action="timer-set" data-value="${n}">${n} דקות</button>`).join('')}</div></div><div class="card"><strong>📊 ההתקדמות שלך</strong><div class="grid" style="margin-top:14px"><div><span class="muted">XP שנצבר</span><h2>${state.xp}</h2></div><div><span class="muted">משימות שבוצעו</span><h2>${taskDone()}</h2></div><div><span class="muted">מטרות</span><h2>${state.goals.length}</h2></div><div><span class="muted">הרגלים</span><h2>${state.habits.length}</h2></div></div></div><div class="card"><strong>⚙️ פרופיל</strong><label style="display:block;margin-top:15px">איך קוראים לך?</label><input class="field" id="username" maxlength="24" value="${esc(state.name)}"><button class="btn secondary" data-action="name-save">שמור שם</button><button class="btn danger" data-action="reset-all" style="margin-right:8px">אפס נתונים</button></div>`}$('#app').innerHTML=html;$('#nav').innerHTML=[['home','⌂','בית'],['tasks','☑','משימות'],['habits','◈','הרגלים'],['avatar','🧑‍🚀','דמות'],['achievements','🏆','הישגים'],['challenges','⚡','אתגרים'],['goals','◎','מטרות'],['focus','◷','ריכוז']].map(([k,icon,title])=>`<button class="${page===k?'active':''}" data-page="${k}"><span>${icon}</span>${title}</button>`).join('')}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function modal(title,fields,done){let host=$('#modalroot');host.innerHTML=`<div class="overlay"><form class="dialog"><div class="row"><h2>${title}</h2><button type="button" class="btn secondary smallbtn" id="closeModal">✕</button></div>${fields}<button type="submit" class="btn full">שמור</button></form></div>`;$('#closeModal').onclick=()=>host.innerHTML='';host.querySelector('form').onsubmit=e=>{e.preventDefault();let form=e.currentTarget;done(form);host.innerHTML='';save();render()}}function taskForm(id){let t=state.tasks.find(x=>x.id==id);modal(t?'עריכת משימה':'משימה חדשה',`<label>שם המשימה</label><input class="field" name="title" required maxlength="100" value="${esc(t?.title||'')}"><label>תאריך</label><input class="field" name="date" type="date" value="${esc(t?.date||today())}"><label>עדיפות</label><select class="field" name="priority">${['רגילה','גבוהה','נמוכה'].map(p=>`<option ${t?.priority===p?'selected':''}>${p}</option>`).join('')}</select>`,f=>{let data={title:f.title.value.trim(),date:f.date.value,priority:f.priority.value};if(t)Object.assign(t,data);else state.tasks.push({id:uid(),...data,done:false})})}function habitForm(){modal('הרגל חדש',`<label>שם ההרגל</label><input class="field" name="title" maxlength="70" required placeholder="למשל: לקרוא 10 דקות"><label>סמל</label><select class="field" name="icon">${['🌱','📚','🏃','💧','🧘','🎯','💪','☀️'].map(x=>`<option>${x}</option>`).join('')}</select>`,f=>state.habits.push({id:uid(),title:f.title.value.trim(),icon:f.icon.value,logs:[]}))}function goalForm(){modal('מטרה חדשה',`<label>שם המטרה</label><input class="field" name="title" maxlength="100" required placeholder="למשל: ללמוד לנגן שיר"><label>צעד ראשון</label><input class="field" name="step" maxlength="100" required placeholder="מה הצעד הראשון?">`,f=>state.goals.push({id:uid(),title:f.title.value.trim(),steps:[{title:f.step.value.trim(),done:false}]}))}function stepForm(id){modal('הוספת צעד',`<label>מה הצעד הבא?</label><input class="field" name="title" maxlength="100" required>`,f=>state.goals.find(x=>x.id==id)?.steps.push({title:f.title.value.trim(),done:false}))}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}let a=b.dataset.action,id=Number(b.dataset.id);if(a==='task-add')return taskForm();if(a==='task-edit')return taskForm(id);if(a==='habit-add')return habitForm();if(a==='goal-add')return goalForm();if(a==='step-add')return stepForm(id);if(a==='shop'){let item=ITEMS.find(x=>x.id===b.dataset.value);if(item){if(item.cost&&!state.owned.includes(item.id)){if(state.coins<item.cost){toast('אין מספיק מטבעות');return}state.coins-=item.cost;state.owned.push(item.id)}state.equipped=item.id;toast('הדמות עודכנה!')}}if(a==='claim'){let c=CHALLENGES.find(x=>x.id===b.dataset.value),key=isoWeek()+':'+b.dataset.value;if(c&&c.progress()>=c.target&&!state.claimed.includes(key)){state.claimed.push(key);state.coins+=c.prize;toast('קיבלת '+c.prize+' מטבעות!')}}if(a==='habit-rest'){let h=state.habits.find(x=>x.id===id);if(h){state.restDays[id]??=[];if(!state.restDays[id].includes(today())){state.restDays[id].push(today());toast('יום מנוחה נרשם ☕')}else toast('כבר רשמת יום מנוחה היום')}}if(a==='task-toggle'){let t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.completedAt=t.done?today():null;if(t.done)earn(20,'task:'+t.id)}}if(a==='task-delete'){if(!confirm('למחוק את המשימה?'))return;state.tasks=state.tasks.filter(x=>x.id!==id)}if(a==='habit-toggle'){let h=state.habits.find(x=>x.id===id);if(h){if(h.logs.includes(today()))h.logs=h.logs.filter(d=>d!==today());else{h.logs.push(today());earn(15,'habit:'+h.id+':'+today())}}}if(a==='habit-delete'){if(!confirm('למחוק את ההרגל?'))return;state.habits=state.habits.filter(x=>x.id!==id)}if(a==='goal-delete'){if(!confirm('למחוק את המטרה?'))return;state.goals=state.goals.filter(x=>x.id!==id)}if(a==='step-toggle'){let g=state.goals.find(x=>x.id===id),i=Number(b.dataset.step);if(g?.steps[i]){g.steps[i].done=!g.steps[i].done;if(g.steps[i].done)earn(30,'step:'+g.id+':'+i)}}if(a==='filter')taskFilter=b.dataset.value;if(a==='name-save'){state.name=$('#username').value.trim()||'אלוף';toast('השם נשמר')}if(a==='reset-all'){if(!confirm('למחוק את כל ההתקדמות?'))return;state=defaults()}if(a==='timer-set'){timerRunning=false;timerSeconds=Number(b.dataset.value)*60}if(a==='timer-reset'){timerRunning=false;timerSeconds=25*60}if(a==='timer-toggle'){timerRunning=!timerRunning;if(timerRunning)timerEnd=Date.now()+timerSeconds*1000}save();render()});timerHandle=setInterval(()=>{if(!timerRunning)return;timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let el=$('#timerDisplay');if(el)el.textContent=clock(timerSeconds);if(timerSeconds===0){timerRunning=false;earn(25,'focus:'+Date.now());save();render();toast('כל הכבוד! סיימת זמן ריכוז 🎉')}},250);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
</script></body></html>
